<script>
  (function() {
    // Dynamic simulated timer
    let seconds = 192;
    const timerElem = document.getElementById('call-timer');
    if (timerElem) {
      setInterval(() => {
        seconds++;
        const mins = Math.floor(seconds / 60);
        const remSecs = seconds % 60;
        timerElem.textContent = `${String(mins).padStart(2, '0')}:${String(remSecs).padStart(2, '0')}`;
      }, 1000);
    }

    // Micro-interaction for Voice button toggling
    const micBtn = document.getElementById('mic-btn');
    const micPulse = document.getElementById('mic-pulse');
    const statusText = document.getElementById('status-text');
    const waveBars = document.querySelectorAll('#wave-container span');
    let isSpeaking = false;

    if (micBtn && statusText) {
      micBtn.addEventListener('click', () => {
        isSpeaking = !isSpeaking;
        if (isSpeaking) {
          statusText.textContent = "You're speaking! 🌟";
          micPulse.classList.add('bg-tertiary-fixed');
          micPulse.classList.remove('bg-primary-container');
          waveBars.forEach(b => {
            b.classList.remove('opacity-50');
            b.style.height = `${Math.floor(Math.random() * 28 + 12)}px`;
          });
        } else {
          statusText.textContent = "Pip is listening...";
          micPulse.classList.add('bg-primary-container');
          micPulse.classList.remove('bg-tertiary-fixed');
        }
      });
    }

    // Subtle Pip bounce on hint
    const hintBtn = document.getElementById('hint-btn');
    const pipAvatar = document.getElementById('pip-avatar');
    if (hintBtn && pipAvatar) {
      hintBtn.addEventListener('click', () => {
        pipAvatar.classList.add('-translate-y-3', 'scale-110');
        setTimeout(() => {
          pipAvatar.classList.remove('-translate-y-3', 'scale-110');
        }, 300);
      });
    }
  })();
</script></main>
